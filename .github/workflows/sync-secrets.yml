name: Sync secrets

# Автодискаверi: реєстру реп немає — наявність .github/workflows/deploy.yml
# у репі і Є фактом "підключений до автодеплою".
on:
  schedule:
    - cron: "17 4 * * *"    # раз на день; для "просто зараз" — кнопка нижче
  workflow_dispatch:

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Distribute PTERO secrets to enrolled repos
        env:
          GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
          PTERO_URL: ${{ secrets.PTERO_URL }}
          PTERO_TOKEN: ${{ secrets.PTERO_TOKEN }}
        run: |
          set -euo pipefail
          for owner in borukva DagerPMC; do
            gh repo list "$owner" --limit 200 --no-archived --json nameWithOwner -q '.[].nameWithOwner' |
            while read -r repo; do
              [ "$repo" = "borukva/mc-deploy" ] && continue   # канон, не чіпаємо
              if gh api "repos/$repo/contents/.github/workflows/deploy.yml" --silent 2>/dev/null; then
                echo "sync -> $repo"
                gh secret set PTERO_URL   -R "$repo" --body "$PTERO_URL"
                gh secret set PTERO_TOKEN -R "$repo" --body "$PTERO_TOKEN"
              fi
            done
          done
